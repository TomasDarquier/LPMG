apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      enableServiceLinks: false # because
      containers:
        - name: kafka-broker
          image: confluentinc/cp-kafka:latest
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx1G -Xms1G"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092,SSL://kafka:9093"
            - name: KAFKA_SSL_CLIENT_AUTH
              value: "required"
            - name: KAFKA_SSL_KEYSTORE_FILENAME
              value: "kafka.broker.keystore.jks"
            - name: KAFKA_SSL_TRUSTSTORE_FILENAME
              value: "kafka.broker.truststore.jks"
#              - name: KAFKA_SSL_KEYSTORE_FILENAME
#              value: "/certs/kafka.broker.keystore.jks"
            - name: KAFKA_SSL_KEYSTORE_CREDENTIALS
              value: "pass"
            - name: KAFKA_SSL_KEY_CREDENTIALS
              value: "pass"
            - name: KAFKA_SSL_TRUSTSTORE_CREDENTIALS
              value: "pass"
          volumeMounts:
            - name: kafka-ssl-vol
              mountPath: "/etc/kafka/secrets"
      volumes:
        - name: kafka-ssl-vol
          secret:
            secretName: kafka-ssl-certificates