apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: tomasdarquier/notification-service:latest
          ports:
            - containerPort: 8150
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: CONFIG_SERVER_URL
              value: "http://config:8888"
          volumeMounts:
            - name: kafka-ssl-notification-service-vol
              mountPath: "/etc/kafka/secrets/certs"
      volumes:
        - name: kafka-ssl-notification-service-vol
          secret:
            secretName: kafka-ssl-certificates-notification-service
