apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: request-service
  template:
    metadata:
      labels:
        app: request-service
    spec:
      containers:
        - name: request-service
          image: tomasdarquier/request-service:latest
          ports:
            - containerPort: 8100
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: CONFIG_SERVER_URL
              value: "http://config:8888"
          volumeMounts:
            - name: kafka-ssl-request-service-vol
              mountPath: "/etc/kafka/secrets/certs"
      volumes:
        - name: kafka-ssl-request-service-vol
          secret:
            secretName: kafka-ssl-certificates-request-service
